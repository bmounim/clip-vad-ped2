[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucsd-vad"
version = "0.1.0"
description = "Training-free, open-vocabulary video anomaly detection with CLIP on UCSD Ped2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mounaim Belkhoumali" }]
keywords = ["computer-vision", "anomaly-detection", "vision-language-models", "clip"]

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
